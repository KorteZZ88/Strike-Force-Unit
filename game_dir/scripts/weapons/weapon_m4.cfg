// ============================================================================
// weapon_m4 — настраиваемые характеристики SFU
// Единицы: время — секунды, скорость — units/sec, цены — доллары.
// После изменения перезапустите карту/игру, чтобы обе DLL перечитали файл.
// ============================================================================

// --- ЭКОНОМИКА ---------------------------------------------------------------
buy_price                 3100      // Цена покупки в магазине
sell_price_new             3100      // Продажа купленного и ни разу не стрелявшего оружия
sell_price_used            1860      // Продажа оружия после выстрела

// --- БОЕПРИПАСЫ И ИНВЕНТАРЬ -------------------------------------------------
clip_size                  30      // Вместимость магазина/оружия
spare_magazines            6      // Максимум запасных магазинов
weight                     15      // Приоритет автопереключения (не физическая масса)

// --- СТРЕЛЬБА ---------------------------------------------------------------
damage                     0         // Урон одной пулей; 0 = значение из skill.cfg
rate_of_fire_rpm           666.67      // Темп стрельбы, выстрелов в минуту
zoom_rate_of_fire_rpm       666.67      // Темп стрельбы в прицеле/альтернативном режиме
empty_click_interval       0.20      // Задержка после щелчка пустого оружия
range                      8192      // Дальность трассировки пули
pellets                    0         // Число пуль/дробин; 0 = штатная схема оружия

// --- ТОЧНОСТЬ ---------------------------------------------------------------
// spread_* — фактическая радианная величина: меньше = точнее.
spread_standing             0.004      // Разброс стоя
spread_moving               0.049      // Разброс в движении
spread_air                  0.115      // Разброс в воздухе
spread_crouched             0.003      // Разброс в приседе
spread_zoomed               0.004      // Разброс при включённом прицеле
recoil                     1.0       // Общий множитель отдачи

// --- ПЕРЕЗАРЯДКА И УПРАВЛЕНИЕ ----------------------------------------------
reload_time                3.5      // Полное время перезарядки
mode_switch_time           0.30      // Переключение прицела/режима огня

// --- ПЕРЕДВИЖЕНИЕ -----------------------------------------------------------
walk_speed                 230      // Скорость с оружием в руках
reload_walk_speed          170      // Скорость во время перезарядки
zoom_walk_speed            170      // Скорость при включённом прицеле

// --- АНИМАЦИИ И СОСТОЯНИЯ --------------------------------------------------
draw_time                  0.50      // Время доставания до первого выстрела
holster_time               0.50      // Время убирания оружия
idle_time                  10.0      // Пауза до idle-анимации
