// SFU vehicle preset: Hummer / Профиль машины SFU: Hummer
// Copy this file to car_yourname.cfg and place a point entity named car_yourname.
// Скопируйте файл как car_вашеимя.cfg и поставьте point entity car_вашеимя.

// Body and separate wheel models / Модели кузова и отдельного колеса
model                       "models/cars/hummer.mdl"
wheelmodel                  "models/cars/hummer_wheel.mdl"
drivermodel                 "models/cars/driver.mdl" // Separate visible driver / Отдельная видимая модель водителя

// Sounds
engine_start_sound          "cars/Hummer/eng_start.wav"
engine_idle_sound           "cars/Hummer/eng_idle.wav"
engine_run_sound            "cars/Hummer/eng_run.wav"
engine_stop_sound           "cars/Hummer/eng_stop.wav"
horn_sound                  "cars/hummer/hummer_horn.wav" // Plays while LMB is held / Звучит, пока зажата ЛКМ
door_sound                  "cars/car_door.wav"
impact_sound_1              "cars/car_impact1.wav"
impact_sound_2              "cars/car_impact2.wav"
impact_sound_3              "cars/car_impact3.wav"
impact_sound_4              "cars/car_impact4.wav"
landing_sound               "cars/landing.wav"

// Local wheel mounts: forward/back, left/right, up/down.
// Локальные точки колёс: вперёд/назад, влево/вправо, вверх/вниз.
wheel_fl_pos                "88 44 -19"
wheel_fr_pos                "88 -44 -19"
wheel_rl_pos                "-77 44 -19"
wheel_rr_pos                "-77 -44 -19"
wheel_radius                "22"    // Visual/raycast radius / Радиус модели и raycast
wheel_width                 "14"     // Reserved for wheel placement / Ширина колеса

// Tyre rotation and grip / Вращение колёс и сцепление шин
drive_type                  "AWD"   // Driven axle: FWD, RWD or AWD / Привод: передний, задний или полный
longitudinal_grip           "1.0"   // Longitudinal tyre-force response; 1 is the normal peak / Продольное сцепление; 1 — обычный максимум
slip_peak                   "0.12"  // Slip ratio where the tyre reaches peak grip / Коэффициент пробуксовки максимального сцепления
slip_falloff                "0.65"  // Grip retained during extreme wheelspin/skid / Доля сцепления при сильном буксе или юзе
rolling_resistance          "12"    // Wheel surface deceleration with pedals released / Замедление вращения колеса при отпущенных педалях
wheel_inertia               "0"     // 0 = automatic from mass and radius; higher changes wheel speed more slowly / 0 = автоматически; больше — колесо медленнее меняет обороты

// Local seat, camera and preferred exit / Локальные позиции водителя, камеры и выхода
driver_pos                  "35 35 -22"
view_pos                    "13 35 18"
exit_pos                    "13 88 0"

// Headlight position and light settings
headlight_left_pos          "100 28 8"  // Local left lamp origin XYZ / Локальная точка левой фары XYZ
headlight_right_pos         "100 -28 8" // Local right lamp origin XYZ / Локальная точка правой фары XYZ
headlight_distance          "900"      // Beam distance / Дальность света
headlight_angle             "40"       // Spotlight cone angle / Угол конуса света
headlight_brightness        "3"        // Light intensity / Яркость
headlight_color             "255 245 220" // RGB color / Цвет RGB

// Speed is in game units per second / Скорость в игровых единицах в секунду
maxspeed                    "1100"
reversespeed                "350"
acceleration                "130"   // Forward/reverse acceleration / Разгон вперёд и назад
brakeforce                  "280"   // Braking while changing direction / Торможение
drag                        "60"    // Coasting resistance / Сопротивление накату
direction_change_delay      "0.50"   // Neutral pause before opposite direction / Пауза в нейтрали перед сменой направления

// Rear-wheel handbrake torque multiplier while SPACE is held.
// Множитель тормозного момента задних колёс при нажатом SPACE.
handbrake_strength          "2.3"

// Steering / Рулевое управление
steerangle                  "30"    // Full low-speed steering angle / Полный угол на малой скорости
steerspeed                  "90"    // Degrees per second / Скорость поворота руля
highspeed_steer_scale       "0.35"  // Steering fraction at max speed / Доля руля на максимальной скорости
lateral_grip                "2.5"     // Sideways tyre grip / Боковое сцепление шин
max_lateral_accel           "300"   // Grip force limit; lower is calmer / Лимит сцепления; меньше — спокойнее

// Raycast suspension / Raycast-подвеска
suspension_length           "20"    // Maximum wheel travel / Максимальный ход колеса
spring_strength             "65"    // Higher is stiffer / Больше — жёстче
suspension_damping          "13"     // Higher suppresses bouncing / Больше — меньше раскачка

// PhysX body / Физический кузов PhysX
mass                        "2100"
center_of_mass              "0 0 -12" // Lower Z resists rollover / Ниже Z — меньше переворотов
linear_damping              "0.08"    // General motion damping / Общее затухание движения
angular_damping             "0.75"    // Rotation damping / Затухание вращения

// Door interaction / Взаимодействие с дверью
// door_action_duration is the complete WAV length. The player changes seat
// door_transition_lead seconds before its end, just before the door slam.
// door_action_duration — полная длина WAV. Посадка/выход происходит за
// door_transition_lead секунд до конца, непосредственно перед хлопком двери.
door_action_duration        "1.717"
door_transition_lead        "0.17"

// Ignition and engine / Зажигание и двигатель
// Hold G for ignition_hold_duration. The idle loop begins after the starter's
// engine_start_duration; leaving the car does not switch the engine off.
// Удерживайте G ignition_hold_duration секунд. Холостой ход начинается после
// engine_start_duration секунд стартера; при выходе мотор остаётся заведённым.
ignition_hold_duration      "0.7"
engine_start_duration       "0.484"

// Dynamic engine mix / Динамическое звучание двигателя
// Pitch follows throttle and actual forward/reverse speed. The two speed
// values control how quickly it rises and falls, in pitch units per second.
// Тон зависит от газа и фактической скорости. Два параметра скорости задают,
// насколько быстро тон повышается и понижается (единиц pitch в секунду).
engine_idle_pitch           "100"
engine_max_pitch            "140"
engine_pitch_up_speed       "100"
engine_pitch_down_speed     "55"
engine_volume               "1.0"
engine_sound_interval       "0.08"  // Network update interval / Интервал сетевого обновления
throttle_rise_time          "0.9"   // Seconds from zero to full throttle / Время от нуля до полного газа
// Legacy compatibility only; the RPM drivetrain no longer uses this curve.
// Только для совместимости; новая трансмиссия эту кривую больше не использует.
drive_force_falloff         "1.0 1.0 0.90 0.65 0.35 0.05"

// Engine and automatic forward transmission / Двигатель и автоматические передачи вперёд
engine_idle_rpm             "800"
// Six RPM/torque(Nm) pairs / Шесть пар RPM/момент(Нм)
engine_torque_curve         "800 360 1400 500 2200 560 3200 530 4200 430 5200 0"
gear_ratios                 "3.00 1.70 1.00 0.72"
reverse_ratio               "-2.90"
final_drive                 "4.10"
transmission_efficiency     "0.88"
shift_up_rpm                "4200"
shift_down_rpm              "1600"
shift_duration              "0.25"

// Simplified automatic torque converter / Упрощённый гидротрансформатор АКПП
// stall_rpm is the engine target at full throttle while the driveline is slow.
// stall_rpm — целевые обороты полного газа при медленной трансмиссии.
torque_converter_stall_rpm       "2400"
// Maximum launch torque multiplication; fades smoothly to 1.0 as slip closes.
// Максимальное усиление момента при старте; плавно снижается до 1.0.
torque_converter_max_ratio       "2.0"
// Slip RPM at which maximum multiplication is reached.
// Разница оборотов, при которой достигается максимальное усиление.
torque_converter_coupling_rpm    "1200"
// Maximum engine RPM change per second; prevents instant free revving.
// Максимальное изменение RPM в секунду; не даёт мотору мгновенно раскрутиться.
torque_converter_response_rpm    "3200"


impact_sound_min_kph        "8" // Minimum impact speed for sound / Минимальная скорость удара для звука
impact_cooldown             "0.35" // Seconds between impacts / Пауза между ударами
collision_damage_threshold_kph "40" // Driver damage starts above this speed / Урон начинается выше этой скорости
collision_damage_at_threshold "2"
collision_damage_reference_kph "100"
collision_damage_at_reference "45"
stationary_hold_max_slope   "5" // Maximum near-flat slope in degrees where a stopped car stays still / Максимальный близкий к ровному уклон в градусах, где остановленная машина не катится
