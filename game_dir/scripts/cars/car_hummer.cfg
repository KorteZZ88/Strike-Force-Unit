// SFU vehicle preset: Hummer / Профиль машины SFU: Hummer
// Copy this file to car_yourname.cfg and place a point entity named car_yourname.
// Скопируйте файл как car_вашеимя.cfg и поставьте point entity car_вашеимя.

// Body and separate wheel models / Модели кузова и отдельного колеса
model                       "models/cars/hummer.mdl"
wheelmodel                  "models/cars/hummer_wheel.mdl"

// Local wheel mounts: forward/back, left/right, up/down.
// Локальные точки колёс: вперёд/назад, влево/вправо, вверх/вниз.
wheel_fl_pos                "48 30 -14"
wheel_fr_pos                "48 -30 -14"
wheel_rl_pos                "-46 30 -14"
wheel_rr_pos                "-46 -30 -14"
wheel_radius                "16"    // Visual/raycast radius / Радиус модели и raycast
wheel_width                 "8"     // Reserved for wheel placement / Ширина колеса

// Local seat, camera and preferred exit / Локальные позиции водителя, камеры и выхода
driver_pos                  "10 8 8"
view_pos                    "18 8 28"
exit_pos                    "0 58 0"

// Speed is in game units per second / Скорость в игровых единицах в секунду
maxspeed                    "600"
reversespeed                "250"
acceleration                "300"   // Forward/reverse acceleration / Разгон вперёд и назад
brakeforce                  "500"   // Braking while changing direction / Торможение
drag                        "80"    // Coasting resistance / Сопротивление накату

// Handbrake braking rate and remaining rear lateral grip while SPACE is held.
// Скорость торможения ручником и остаточное боковое сцепление задних колёс при нажатом SPACE.
handbrake_strength          "4.0"
handbrake_rear_grip         "0.25"

// Steering / Рулевое управление
steerangle                  "30"    // Full low-speed steering angle / Полный угол на малой скорости
steerspeed                  "90"    // Degrees per second / Скорость поворота руля
highspeed_steer_scale       "0.35"  // Steering fraction at max speed / Доля руля на максимальной скорости
lateral_grip                "4"     // Sideways tyre grip / Боковое сцепление шин
max_lateral_accel           "500"   // Grip force limit; lower is calmer / Лимит сцепления; меньше — спокойнее

// Raycast suspension / Raycast-подвеска
suspension_length           "20"    // Maximum wheel travel / Максимальный ход колеса
spring_strength             "45"    // Higher is stiffer / Больше — жёстче
suspension_damping          "6"     // Higher suppresses bouncing / Больше — меньше раскачка

// PhysX body / Физический кузов PhysX
mass                        "1800"
center_of_mass              "0 0 -12" // Lower Z resists rollover / Ниже Z — меньше переворотов
linear_damping              "0.08"    // General motion damping / Общее затухание движения
angular_damping             "0.45"    // Rotation damping / Затухание вращения
