// SFU vehicle preset: Hummer / Профиль машины SFU: Hummer
// Copy this file to car_yourname.cfg and place a point entity named car_yourname.
// Скопируйте файл как car_вашеимя.cfg и поставьте point entity car_вашеимя.

// Body and separate wheel models / Модели кузова и отдельного колеса
model                       "models/cars/hummer.mdl"
wheelmodel                  "models/cars/hummer_wheel.mdl"
drivermodel                 "models/cars/driver.mdl" // Separate visible driver; real player is hidden / Отдельная видимая модель водителя; настоящий игрок скрыт

// Collision, driver damage and landing / Столкновения, урон водителю и приземление
impact_sound_1              "cars/car_impact1.wav"
impact_sound_2              "cars/car_impact2.wav"
impact_sound_3              "cars/car_impact3.wav"
impact_sound_4              "cars/car_impact4.wav"
landing_sound               "cars/landing.wav"
impact_sound_min_kph        "8"    // Minimum impact speed for sound / Минимальная скорость удара для звука
impact_cooldown             "0.35" // Prevents sound spam / Не даёт звукам спамить
collision_damage_threshold_kph "40" // Driver damage starts above this speed / Урон водителю начинается выше этой скорости
collision_damage_at_threshold "2"   // Damage just above the threshold / Урон сразу после порога
collision_damage_reference_kph "100" // Reference impact speed / Контрольная скорость удара
collision_damage_at_reference "45"   // Damage at the reference speed / Урон на контрольной скорости

// Driver controls, progressive throttle and headlights / Управление, плавный газ и фары
throttle_rise_time          "0.5"   // Seconds from zero to full throttle / Время от нуля до полного газа
acceleration_end_scale      "0.2"   // Acceleration fraction near maximum speed / Доля ускорения у максимальной скорости
drive_force_falloff         "1.0 1.0 0.90 0.65 0.35 0.05" // Drive force at 0/25/50/75/90/100% max speed / Тяга на 0/25/50/75/90/100% максимальной скорости
horn_sound                  "cars/hummer/hummer_horn.wav" // Plays while LMB is held / Звучит, пока зажата ЛКМ
headlight_left_pos          "90 28 8"  // Local left lamp origin XYZ / Локальная точка левой фары XYZ
headlight_right_pos         "90 -28 8" // Local right lamp origin XYZ / Локальная точка правой фары XYZ
headlight_distance          "700"      // Beam distance / Дальность света
headlight_angle             "35"       // Spotlight cone angle / Угол конуса света
headlight_brightness        "2"        // Light intensity / Яркость
headlight_color             "255 245 220" // RGB color / Цвет RGB

// Local wheel mounts: forward/back, left/right, up/down.
// Локальные точки колёс: вперёд/назад, влево/вправо, вверх/вниз.
wheel_fl_pos                "48 30 -14"
wheel_fr_pos                "48 -30 -14"
wheel_rl_pos                "-46 30 -14"
wheel_rr_pos                "-46 -30 -14"
wheel_radius                "16"    // Visual/raycast radius / Радиус модели и raycast
wheel_width                 "8"     // Reserved for wheel placement / Ширина колеса

// Local seat, camera and preferred exit / Локальные позиции водителя, камеры и выхода
driver_pos                  "10 8 8"
view_pos                    "18 8 28"
exit_pos                    "0 58 0"

// Speed is in game units per second / Скорость в игровых единицах в секунду
maxspeed                    "600"
reversespeed                "250"
acceleration                "300"   // Forward/reverse acceleration / Разгон вперёд и назад
brakeforce                  "500"   // Braking while changing direction / Торможение
drag                        "80"    // Coasting resistance / Сопротивление накату
direction_change_delay      "0.5"   // Neutral pause before opposite direction / Пауза в нейтрали перед сменой направления
stationary_hold_max_slope   "5"     // Maximum slope angle in degrees where a stopped car is held still / Максимальный угол уклона, на котором остановленная машина удерживается на месте

// Handbrake braking rate and remaining rear lateral grip while SPACE is held.
// Скорость торможения ручником и остаточное боковое сцепление задних колёс при нажатом SPACE.
handbrake_strength          "4.0"
handbrake_rear_grip         "0.25"

// Steering / Рулевое управление
steerangle                  "30"    // Full low-speed steering angle / Полный угол на малой скорости
steerspeed                  "90"    // Degrees per second / Скорость поворота руля
highspeed_steer_scale       "0.35"  // Steering fraction at max speed / Доля руля на максимальной скорости
lateral_grip                "4"     // Sideways tyre grip / Боковое сцепление шин
max_lateral_accel           "500"   // Grip force limit; lower is calmer / Лимит сцепления; меньше — спокойнее

// Raycast suspension / Raycast-подвеска
suspension_length           "20"    // Maximum wheel travel / Максимальный ход колеса
spring_strength             "45"    // Higher is stiffer / Больше — жёстче
suspension_damping          "6"     // Higher suppresses bouncing / Больше — меньше раскачка

// PhysX body / Физический кузов PhysX
mass                        "1800"
center_of_mass              "0 0 -12" // Lower Z resists rollover / Ниже Z — меньше переворотов
linear_damping              "0.08"    // General motion damping / Общее затухание движения
angular_damping             "0.45"    // Rotation damping / Затухание вращения
