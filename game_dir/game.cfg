// Enable the round-based Red vs Blue bomb-defusal mode.
mp_bombmode 1

// Bomb-mode team display names and round duration in minutes.
sv_team1name "Red"
sv_team2name "Blue"
mp_roundtime 3 //minutes
mp_c4timer 35 //seconds
mp_roundlimit 30 //rounds
mp_winlimit 12 //wins

// Counter-Strike style economy. Set mp_moneylimit to 0 for no practical limit.
mp_startmoney 800
mp_moneylimit 16000
mp_moneydrop 1
mp_moneydrop_count 100
mp_sellweapon 1

// Base player movement speed. Individual heavy weapons override this on deploy.
sv_maxspeed 250

// Show the multiplayer kill feed. Console death notices remain enabled.
mp_killfeed 0
